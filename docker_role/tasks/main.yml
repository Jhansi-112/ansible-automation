---
- name: Install Docker
  apt:
    name: "{{ docker_package }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - install

- name: Make sure /etc/docker exists
  file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - configure

- name: Copy Docker daemon config (log rotation)
  template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker
  tags:
    - configure

- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: yes
  tags:
    - service

- name: Add users to the docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: yes
  loop: "{{ docker_users }}"
  tags:
    - configure

- name: Check Docker version
  command: docker --version
  register: docker_check
  changed_when: false
  when: not ansible_check_mode
  tags:
    - verify

- name: Show Docker version
  debug:
    msg: "{{ docker_check.stdout }}"
  when: not ansible_check_mode
  tags:
    - verify
