---
- name: Install Java (JDK)
  apt:
    name: "{{ java_package }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - install

- name: Set JAVA_HOME for all users
  template:
    src: java.sh.j2
    dest: /etc/profile.d/java.sh
    owner: root
    group: root
    mode: '0644'
  tags:
    - configure

- name: Check Java version
  command: java -version
  register: java_check
  changed_when: false
  when: not ansible_check_mode
  tags:
    - verify

- name: Show Java version
  debug:
    msg: "{{ java_check.stderr_lines }}"
  when: not ansible_check_mode
  tags:
    - verify
