---
- name: Install Maven
  apt:
    name: "{{ maven_package }}"
    state: present
    update_cache: yes
    cache_valid_time: 3600
  tags:
    - install

- name: Check Maven version
  command: mvn -version
  register: maven_check
  changed_when: false
  when: not ansible_check_mode
  tags:
    - verify

- name: Show Maven version
  debug:
    msg: "{{ maven_check.stdout_lines }}"
  when: not ansible_check_mode
  tags:
    - verify
